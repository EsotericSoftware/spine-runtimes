name: Release spine-ts

on:
  push:
    tags:
      - 'spine-ts-*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version, matching spine-ts/package.json (for example: 4.3.8)'
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24'
        registry-url: 'https://registry.npmjs.org'
    - name: Build spine-ts
      working-directory: spine-ts
      env:
        TS_UPDATE_URL: ${{secrets.TS_UPDATE_URL}}
        TS_RELEASE_VERSION: ${{ inputs.version }}
      run: ./build.sh
    - name: Publish npm packages
      working-directory: spine-ts
      run: npm publish --access public --workspaces
    - name: Deploy spine-construct3
      working-directory: spine-ts
      env:
        C3_UPDATE_URL: ${{secrets.C3_UPDATE_URL}}
      run: ./spine-construct3/build.sh
