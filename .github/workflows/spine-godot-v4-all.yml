name: Build spine-godot (All Godot 4.x versions)

on:
  push:
    paths:
      - ".github/workflows/build-spine-godot-gdextension-all.yml"
      - "spine-godot/**"
      - "spine-cpp/**"
  workflow_dispatch:

jobs:
  build-versions:
    strategy:
      matrix:
        version:
          [
            {"tag": "4.5-stable",  "version": "4.5.stable",  "dev": false},
            {"tag": "4.4.1-stable","version": "4.4.1.stable","dev": false},
            {"tag": "4.3-stable",  "version": "4.3.stable",  "dev": false}
          ]
    uses: ./.github/workflows/spine-godot-v4.yml
    with:
      godot_tag: ${{ matrix.version.tag }}
      godot_version: ${{ matrix.version.version }}
      godot_mono: ${{ matrix.version.mono }}
    secrets: inherit
