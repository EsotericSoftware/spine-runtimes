name: Release spine-haxe

on:
  push:
    tags:
      - 'spine-haxe-*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version, matching spine-haxe/haxelib.json (for example: 4.3.2)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Build spine-haxe
      working-directory: spine-haxe
      env:
        HAXE_UPDATE_URL: ${{secrets.HAXE_UPDATE_URL}}
        HAXE_RELEASE_VERSION: ${{ inputs.version }}
      run: ./build.sh
