<!DOCTYPE html>
<html>

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<!--<script src="https://unpkg.com/@esotericsoftware/spine-canvas@4.3.*/dist/iife/spine-canvas.js"></script>-->
	<script src="../dist/iife/spine-canvas.js"></script>
</head>

<body style="margin: 0; padding: 0; background: #333; overflow: hidden;">
	<div style="position: absolute; left: 12px; top: 12px; z-index: 1; color: white; font: 14px sans-serif; user-select: none;">
		Spineboy portal: clipping attachment and additive blend modes.
	</div>
	<canvas id="canvas" style="width: 100%; height: 100vh;"></canvas>
</body>

<script>
	let lastFrameTime = Date.now() / 1000;
	let canvas, context;
	let assetManager;
	let skeleton, animationState, bounds;
	let skeletonRenderer;
	let fitScale = 1;
	const fitPadding = 0.2;

	async function load() {
		canvas = document.getElementById("canvas");
		context = canvas.getContext("2d");
		skeletonRenderer = new spine.SkeletonRenderer(context);
		// Clipping needs triangle rendering to preserve Spine semantics (inverse and concave clips).
		skeletonRenderer.triangleRendering = true;

		assetManager = new spine.AssetManager("/assets/");
		assetManager.loadBinary("spineboy-pro.skel");
		assetManager.loadTextureAtlas("spineboy.atlas");
		await assetManager.loadAll();

		const atlas = assetManager.require("spineboy.atlas");
		const atlasLoader = new spine.AtlasAttachmentLoader(atlas);
		const skeletonBinary = new spine.SkeletonBinary(atlasLoader);
		const skeletonData = skeletonBinary.readSkeletonData(assetManager.require("spineboy-pro.skel"));

		skeleton = new spine.Skeleton(skeletonData);
		skeleton.setupPose();
		skeleton.updateWorldTransform(spine.Physics.update);
		bounds = skeleton.getBoundsRect();
		resizeCanvas();
		fitScale = Math.min(canvas.width / bounds.width, canvas.height / bounds.height) * fitPadding;

		const animationStateData = new spine.AnimationStateData(skeleton.data);
		animationStateData.defaultMix = 0.2;
		animationState = new spine.AnimationState(animationStateData);
		animationState.setAnimation(0, "portal", true);

		requestAnimationFrame(render);
	}

	function resizeCanvas() {
		if (canvas.width != canvas.clientWidth || canvas.height != canvas.clientHeight) {
			canvas.width = canvas.clientWidth;
			canvas.height = canvas.clientHeight;
		}
	}

	function fitSkeleton() {
		const scale = Math.min(fitScale, Math.min(canvas.width / bounds.width, canvas.height / bounds.height) * fitPadding);
		skeleton.scaleX = scale;
		skeleton.scaleY = -scale;
		skeleton.x = canvas.width / 2 - (bounds.x + bounds.width / 2) * scale;
		skeleton.y = canvas.height / 2 + (bounds.y + bounds.height / 2) * scale;
	}

	function render() {
		const now = Date.now() / 1000;
		const delta = now - lastFrameTime;
		lastFrameTime = now;

		resizeCanvas();
		context.clearRect(0, 0, canvas.width, canvas.height);

		fitSkeleton();

		animationState.update(delta);
		animationState.apply(skeleton);
		skeleton.updateWorldTransform(spine.Physics.update);
		skeletonRenderer.draw(skeleton);

		requestAnimationFrame(render);
	}

	load();
</script>

</html>
