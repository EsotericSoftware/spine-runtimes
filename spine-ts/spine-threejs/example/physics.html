<html>
  <head>
    <meta charset="UTF-8" />
    <title>spine-threejs</title>
    <style>
      * {
        margin: 0;
        padding: 0;
      }

      body,
      html {
        height: 100%;
      }

      canvas {
        position: absolute;
        width: 100%;
        height: 100%;
      }

      #instructions {
        position: absolute;
        left: 12px;
        top: 12px;
        z-index: 1;
        padding: 8px 10px;
        color: white;
        background: rgba(0, 0, 0, 0.55);
        font-family: sans-serif;
        font-size: 13px;
        line-height: 1.4;
        pointer-events: none;
      }
    </style>

    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.159.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.159.0/examples/jsm/",
            "spine-threejs": "../dist/esm/spine-threejs.mjs"
        }
    }
    </script>
  </head>

  <body>
    <div id="instructions">
      Mouse: orbit camera<br />
      Arrow keys / WASD: move Celeste<br />
      Shift: move faster
    </div>
    <script type="module">
      import * as THREE from "three";
      import * as spine from "spine-threejs";
      import { OrbitControls } from 'three/addons/controls/OrbitControls.js'

      let scene, camera, renderer;
      let geometry, material, mesh, skeletonMesh, atlas, atlasLoader;
      let assetManager;
      let canvas;
      let controls;
      let lastFrameTime = Date.now() / 1000;
      let pressedKeys = Object.create(null);
      const moveSpeed = 500;

      let baseUrl = "/assets/";
      let skeletonFile = "celestial-circus-pro.json";
      let atlasFile = `celestial-circus-pma.atlas`;

      function init() {
        // create the THREE.JS camera, scene and renderer (WebGL)
        let width = window.innerWidth,
          height = window.innerHeight;
        camera = new THREE.PerspectiveCamera(75, width / height, 1, 3000);
        camera.position.y = 0;
        camera.position.z = 800;
        scene = new THREE.Scene();
        renderer = new THREE.WebGLRenderer();
        renderer.setSize(width, height);
        document.body.appendChild(renderer.domElement);
        canvas = renderer.domElement;
        controls = new OrbitControls(camera, renderer.domElement);

        window.addEventListener("keydown", (event) => {
          pressedKeys[event.code] = true;
          if (event.code.startsWith("Arrow")) event.preventDefault();
        });
        window.addEventListener("keyup", (event) => {
          pressedKeys[event.code] = false;
          if (event.code.startsWith("Arrow")) event.preventDefault();
        });

        // load the assets required to display the Celeste model
        assetManager = new spine.AssetManager(baseUrl);
        assetManager.loadText(skeletonFile);
        assetManager.loadTextureAtlas(atlasFile);

        requestAnimationFrame(load);
      }

      function load(name, scale) {
        if (assetManager.isLoadingComplete()) {
          geometry = new THREE.BoxGeometry(200, 200, 200);
          material = new THREE.MeshBasicMaterial({
            color: 0xff0000,
            wireframe: true,
          });
          mesh = new THREE.Mesh(geometry, material);
          scene.add(mesh);

          // Load the texture atlas using name.atlas and name.png from the AssetManager.
          // The function passed to TextureAtlas is used to resolve relative paths.
          atlas = assetManager.require(atlasFile);

          // Create a AtlasAttachmentLoader that resolves region, mesh, boundingbox and path attachments
          atlasLoader = new spine.AtlasAttachmentLoader(atlas);

          // Create a SkeletonJson instance for parsing the .json file.
          let skeletonJson = new spine.SkeletonJson(atlasLoader);

          // Set the scale to apply during parsing, parse the file, and create a new skeleton.
          skeletonJson.scale = 0.4;
          let skeletonData = skeletonJson.readSkeletonData(
            assetManager.require(skeletonFile)
          );

            // Create a SkeletonMesh from the data and attach it to the scene
            skeletonMesh = new spine.SkeletonMesh({
              skeletonData,
              materialFactory: (parameters) => {
                return new THREE.MeshBasicMaterial({
                  ...parameters,
                  // transparent: true,
                  // depthWrite: true,
                  // depthTest: true,
                  // alphaTest: 0.001,
                  // vertexColors: true,
                });
              },
              twoColorTint: false,
            });
            skeletonMesh.state.setAnimation(1, "eyeblink-long", true);
            mesh.add(skeletonMesh);

          skeletonMesh.position.y = -200;

          requestAnimationFrame(render);
        } else requestAnimationFrame(load);
      }

      let lastTime = Date.now();
      function render() {
        // calculate delta time for animation purposes
        let now = Date.now() / 1000;
        let delta = now - lastFrameTime;
        lastFrameTime = now;

        // resize canvas to use full page, adjust camera/renderer
        resize();

        // Update orbital controls
        controls.update();

        updateKeyboardMovement(delta);

        // update the animation
        skeletonMesh.update(delta);

        // render the scene
        renderer.render(scene, camera);

        requestAnimationFrame(render);
      }

      function updateKeyboardMovement(delta) {
        if (!mesh) return;

        const speed = moveSpeed * (pressedKeys.ShiftLeft || pressedKeys.ShiftRight ? 3 : 1);
        const distance = speed * delta;

        if (pressedKeys.ArrowLeft || pressedKeys.KeyA) mesh.position.x -= distance;
        if (pressedKeys.ArrowRight || pressedKeys.KeyD) mesh.position.x += distance;
        if (pressedKeys.ArrowUp || pressedKeys.KeyW) mesh.position.y += distance;
        if (pressedKeys.ArrowDown || pressedKeys.KeyS) mesh.position.y -= distance;
      }

      function resize() {
        let w = window.innerWidth;
        let h = window.innerHeight;
        if (canvas.width != w || canvas.height != h) {
          canvas.width = w;
          canvas.height = h;
        }

        camera.aspect = w / h;
        camera.updateProjectionMatrix();

        renderer.setSize(w, h);
      }

      init();

    </script>
  </body>
</html>
